[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-alpha.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/happyproto/cli"
rust-version = "1.93"

[workspace.dependencies]
hpy-plugin = { path = "crates/hpy-plugin" }
hpy-project = { path = "crates/hpy-project" }
hpy-atproto = { path = "crates/hpy-atproto" }
async-trait = "0.1.92"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
data-encoding = "2.11"
etcetera = "0.11"
imagesize = "0.15"
inquire = "0.9"
jacquard = { version = "=0.12.2", default-features = false, features = ["dns"] }
libc = "0.2"
miette = { version = "7.6", features = ["fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal"] }
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-segmentation = "1.13"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
