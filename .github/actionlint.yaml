self-hosted-runner:
  # Depot runners (https://depot.dev/docs/github-actions/runner-types)
  labels:
    - depot-ubuntu-24.04
    - depot-ubuntu-24.04-arm
    - depot-macos-15
    - depot-windows-2022
paths:
  # Generated by `dist generate`; its shell style is dist's to change.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue'
