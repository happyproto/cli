name: CI

on:
  pull_request:
  push:
    branches: [main, beta, alpha]

jobs:
  # Lint, typecheck and vitest on each OS, under the oldest Node the package
  # supports (package.json `engines`) and the current LTS. On the LTS leg the
  # spawned-binary suite (test/cli) then runs again against the Bun-compiled
  # binary, since Bun can fail where Node passes (HANDOFF §5 risk 6).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-macos-15, depot-windows-2022]
        node: ["22.20.0", lts/*]
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # test/cli runs dist/hpy.mjs under this Node.
      - run: npm run build
      - run: npx vitest run
      - uses: oven-sh/setup-bun@v2
        if: matrix.node == 'lts/*'
        with:
          bun-version-file: .bun-version
      - name: Build the Bun binary
        if: matrix.node == 'lts/*'
        id: bun
        # Compiles for this runner's target, checks both addons are embedded,
        # and smoke-tests it (--version, --help).
        run: |
          node scripts/build-bun.mjs
          # A native path (not Git Bash's /d/...), for execa on Windows.
          echo "bin=$(node -p 'require("path").resolve("dist/bun", require("fs").readdirSync("dist/bun")[0])')" >> "$GITHUB_OUTPUT"
      - name: Spawned-binary tests against the Bun binary
        if: matrix.node == 'lts/*'
        env:
          HPY_TEST_BIN: ${{ steps.bun.outputs.bin }}
        run: npx vitest run test/cli

  # The Rust-vs-TypeScript parity harness (HANDOFF §4), offline. The Rust
  # reference is built from origin/alpha (D11); once alpha no longer has the
  # crates, from the last alpha commit before they were removed.
  parity:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the Rust reference
        id: ref
        run: |
          git fetch --quiet origin alpha
          ref=origin/alpha
          if ! git cat-file -e "$ref:Cargo.toml" 2>/dev/null; then
            ref="$(git rev-list -1 "$ref" -- Cargo.toml)^"
          fi
          git worktree add --detach "$RUNNER_TEMP/rust-ref" "$ref"
          echo "sha=$(git rev-parse "$ref")" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/rust-ref" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.ref.outputs.dir }} -> target
          key: parity-${{ steps.ref.outputs.sha }}
      - name: Build the Rust reference
        working-directory: ${{ steps.ref.outputs.dir }}
        run: cargo build --release --locked -p hpy-cli
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - run: npm run build
      - name: Parity, node dist/hpy.mjs
        env:
          RUST_HPY: ${{ steps.ref.outputs.dir }}/target/release/hpy
        run: node test/parity/run.mjs --strict-stderr --offline
      - name: Parity, the Bun binary
        env:
          RUST_HPY: ${{ steps.ref.outputs.dir }}/target/release/hpy
        run: |
          node scripts/build-bun.mjs
          node test/parity/run.mjs --strict-stderr --offline --ts "$(ls "$PWD"/dist/bun/hpy-*)"

  packaging:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck packaging/*.sh scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - run: npm ci
      # The dist config plans every target, and the npm package packs only
      # the bundle.
      - run: dist plan
      - run: npm run build && npm pack --dry-run
      # The shell installer, against this checkout's own installer and Bun
      # archive (built with dist) served locally, with a stand-in sudo: it
      # never runs the real one.
      - run: packaging/test-installer.sh --local

  # Fails on any advisory in the npm dependencies, which the bundle and the
  # binaries ship.
  audit:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm audit

  # Decides the next version from the conventional commits since the last
  # release, bumps package.json/package-lock.json/dist.toml/CHANGELOG.md, tags
  # it, and dispatches release.yml (dist) to build and publish that tag.
  release:
    needs: [test, packaging]
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Release
        id: semantic
        env:
          # A token that can push to main if it is ever protected; the
          # workflow token works while it is not.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          -p semantic-release-gha-output@1
          semantic-release
