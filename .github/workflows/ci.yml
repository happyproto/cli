name: CI

on:
  pull_request:
  push:
    branches: [main, beta, alpha]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-macos-15, depot-windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # The pty test skips where it cannot open a terminal; here it must run.
      HPY_REQUIRE_PTY_TEST: ${{ !startsWith(matrix.os, 'depot-windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build a real script module
        if: ${{ !startsWith(matrix.os, 'depot-windows') }}
        run: cargo test -p hpy-cli --bin hpy -- --ignored a_real_cargo_build_produces_a_wasm_module

  packaging:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck packaging/*.sh scripts/*.sh

  audit:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any advisory not triaged in .cargo/audit.toml, so newly
      # disclosed vulnerabilities in our dependencies are caught.
      - run: cargo audit

  # Decides the next version from the conventional commits since the last
  # release, bumps Cargo.toml/Cargo.lock/CHANGELOG.md, tags it, and dispatches
  # release.yml (dist) to build and publish that tag.
  release:
    needs: [test, packaging]
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Release
        id: semantic
        env:
          # A token that can push to main if it is ever protected; the
          # workflow token works while it is not.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/exec@7
          -p @semantic-release/git@11
          -p semantic-release-gha-output@1
          semantic-release
